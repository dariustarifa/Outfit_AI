kind = "mobile"
previewPath = "/"
title = "Outfit"
description = "A native personal styling app that helps people choose outfits from their own wardrobe based on the weather and their plans. The first setup phase establishes the app structure, shared Outfit design-system assets, and local state foundations."
version = "1.0.0"
id = "artifacts/outfit"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22796

[services.development]
run = "pnpm --filter @workspace/outfit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/outfit", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/outfit", "run", "serve" ]

[services.env]
PORT = "22796"
BASE_PATH = "/"
